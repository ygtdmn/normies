name: Arena contracts
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/arena.yml"
      - "foundry.toml"
      - "remappings.txt"
      - "package.json"
      - "bun.lockb"
      - "src/arena/**"
      - "src/NormiesArena*.sol"
      - "src/NormiesCanvasStorageV2.sol"
      - "script/DeployArena.s.sol"
      - "script/ArenaLocal.s.sol"
      - "test/arena/**"
      - "test/audit/arena/**"
permissions:
  contents: read
jobs:
  arena:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: bun install --frozen-lockfile
      - run: >-
          forge fmt --check src/arena src/NormiesArena.sol src/NormiesArenaStorage.sol src/NormiesArenaQueue.sol
          src/NormiesArenaSkins.sol script/DeployArena.s.sol script/ArenaLocal.s.sol test/arena test/audit/arena
      - run: forge build
      # Fork tests skip without an RPC URL.
      - run: forge test --match-path 'test/arena/*' -vv
        env:
          FOUNDRY_PROFILE: ci
      - run: forge test --match-path 'test/audit/arena/*' -vv
        env:
          FOUNDRY_PROFILE: ci
